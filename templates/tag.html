{% extends "base.html" %}
{% block content %}
<main class="container">
  <section>
    <h2>标签：{{ tag_name }}</h2>
    <p class="post-meta">{{ tag_posts|length }} 篇文章</p>
    <ul class="posts">
      {% for p in tag_posts %}
      <li>
        <a href="/posts/{{ p.slug }}.html">{{ p.title }}</a>
        <small>{{ p.date }}</small>
      </li>
      {% endfor %}
    </ul>
    <p><a href="/tags.html">← 全部标签</a></p>
  </section>
</main>
{% endblock %}
